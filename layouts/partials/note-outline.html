{{- if in .TableOfContents "<li>" -}}
<details class="note-toc-sidebar" aria-label="本文大纲" data-reader-panel="1100" open>
    <summary class="note-toc-summary">
        <span class="note-toc-title">本文大纲</span>
        <span class="note-panel-chevron" aria-hidden="true">⌄</span>
    </summary>
    <div class="note-toc-content">
        {{ .TableOfContents }}
    </div>
</details>
{{- end -}}
