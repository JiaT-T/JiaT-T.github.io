{{- define "main" }}

<header class="page-header search-header">
    <h1>{{ .Title }}</h1>
    {{- with .Description }}
    <div class="post-description">{{ . }}</div>
    {{- end }}
</header>

<div id="searchbox" class="searchbox">
    <input id="searchInput" autofocus placeholder="{{ .Params.placeholder | default "输入关键词搜索" }}"
        aria-label="{{ .Title }}" type="search" autocomplete="off" maxlength="64">
    <p id="searchStatus" class="search-status" aria-live="polite"></p>
    <ul id="searchResults" class="searchResults" aria-label="search results"></ul>
</div>

{{- end }}{{/* end main */}}
