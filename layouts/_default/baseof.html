<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.Direction | default "ltr" }}" data-theme="{{ site.Params.defaultTheme | default "dark" }}">
<head>{{ partial "head.html" . }}</head>
<body id="top"{{ if or (ne .Kind "page") (eq .Layout "archives") (eq .Layout "search") }} class="list"{{ end }}>
  {{ partial "header.html" . }}
  <main class="main" id="main-content" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partialCached "footer.html" . .Layout .Kind (.Param "hideFooter") (.Param "ShowCodeCopyButtons") }}
</body>
</html>
