<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.Direction | default "ltr" }}" data-theme="{{ site.Params.defaultTheme | default "dark" }}">
<head>{{ partial "head.html" . }}</head>
<body id="top" class="{{ if or (ne .Kind "page") (eq .Layout "archives") (eq .Layout "search") }}list{{ end }}{{ if .IsHome }} is-home{{ end }}">
  {{ partialCached "site-ambient.html" . .IsHome }}
  {{ partial "header.html" . }}
  <main class="main{{ if .IsHome }} home-main{{ end }}" id="main-content" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partialCached "footer.html" . .Layout .Kind (.Param "hideFooter") (.Param "ShowCodeCopyButtons") }}
</body>
</html>
