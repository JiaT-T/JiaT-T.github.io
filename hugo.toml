baseURL = "https://jiat-t.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
title = "榎aaaa的个人主页"
theme = "PaperMod"

[params]
    env = "production"
    title = "榎aaaa · Graphics & Game Development"
    description = "榎aaaa的开发者主页：C++、实时渲染、Unreal Engine 项目与图形学技术笔记。"
    author = "榎aaaa"
    defaultTheme = "dark"
    disableThemeToggle = false
    ShowReadingTime = true
    ShowBreadCrumbs = true
    ShowPostNavLinks = true
    ShowCodeCopyButtons = true
    images = ["images/avatar.jpg"]

    [params.assets]
        favicon = "favicon.svg"
        favicon16x16 = "favicon-16x16.png"
        favicon32x32 = "favicon-32x32.png"
        apple_touch_icon = "apple-touch-icon.png"
        safari_pinned_tab = "favicon.svg"
        theme_color = "#111315"

    # 主页配置
    [params.profileMode]
        enabled = true
        title = "榎aaaa"
subtitle = """
计算机专业本科在读，主要关注 C++、计算机图形学、实时渲染与 Unreal Engine。

这里记录一些学习笔记，也整理自己做过的渲染与引擎相关小项目。
"""
        imageUrl = "/images/avatar.jpg"
        imageWidth = 100
        imageHeight = 100
        
        # 按钮配置
[[params.profileMode.buttons]]
            name = "渲染与引擎项目"
            url = "/portfolio/"
[[params.profileMode.buttons]]
            name = "阅读技术笔记"
            url = "/archives/"  # 这里的 URL 指向刚才创建的 archives 页面

    # 社交链接（显示在名字下方）
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/JiaT-T"

[markup.highlight]
    noClasses = false # 这里改为 false，我们需要用类名来控制反向颜色
    style = "monokai" # 明亮模式下使用的深色风格
    lineNos = true
    lineNumbersInTable = false

[markup.tableOfContents]
    startLevel = 2
    endLevel = 5
    ordered = false

[markup.goldmark.renderer]
    unsafe = true # 支持在 MD 中嵌套一些简单的 HTML

# 保留 LaTeX 原文，交给现有 MathJax 渲染。
[markup.goldmark.extensions.passthrough]
    enable = true
[markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

# 文章列表与分类继续保留在笔记页。
[[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
[[menu.main]]
    identifier = "portfolio"
    name = "项目"
    url = "/portfolio/"
    weight = 5
[[menu.main]]
    identifier = "notes"
    name = "笔记"
    url = "/archives/"
    weight = 10
[[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/#about"
    weight = 20
[[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30

[outputs]
    home = ["HTML", "RSS", "JSON"]
