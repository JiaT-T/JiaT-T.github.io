baseURL = "https://JiaT-T.github.io/"
languageCode = "zh-cn"
title = "榎aaaa的个人主页"
theme = "PaperMod"

[params]
    env = "production"
    title = "代码与艺术"
    description = "图形学、C++ 渲染与游戏引擎开发笔记"
    author = "榎aaaa"
    defaultTheme = "light" # 允许自动切换
    disableThemeToggle = true    # 隐藏右上角的太阳/月亮切换按钮
    displayRGBColor = true

    # 主页配置
    [params.profileMode]
        enabled = true
        title = "榎aaaa"
subtitle = """
计算机专业本科在读，主要关注计算机图形学、实时渲染和游戏引擎方向。

这里记录一些学习笔记，也整理自己做过的渲染与引擎相关小项目。
"""
        imageUrl = "/images/avatar.jpg"
        imageWidth = 100
        imageHeight = 100
        
        # 按钮配置
[[params.profileMode.buttons]]
            name = "📚 进入笔记入口"
            url = "/archives/"  # 这里的 URL 指向刚才创建的 archives 页面

    # 社交链接（显示在名字下方）
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/JiaT-T"
    [[params.socialIcons]]
        name = "email"
        url = "mailto:你的邮箱@example.com"

[markup.highlight]
    noClasses = false # 这里改为 false，我们需要用类名来控制反向颜色
    style = "monokai" # 明亮模式下使用的深色风格
    lineNos = true

[markup.tableOfContents]
    startLevel = 2
    endLevel = 5
    ordered = false

[markup.goldmark.renderer]
    unsafe = true # 支持在 MD 中嵌套一些简单的 HTML

# 顶部导航栏分类
[[menu.main]]
    identifier = "posts"
    name = "所有文章"
    url = "/posts/"
    weight = 10
[[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 20
[[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30

[outputs]
    home = ["HTML", "RSS", "JSON"]
